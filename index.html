<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --red:      #810E0E;
    --cream:    #F5F0E8;
    --bg:       #0F0F0F;
    --bg-card:  #1a1a1a;
    --bg-post1: #1a1414;
    --gray:     #888888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
  }

  /* ─── PAGE WRAPPER ─────────────────────────────────────── */
  .page-wrapper {
    display: flex;
    gap: 60px;
    max-width: 1400px;
    width: 100%;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ─── PHONE FRAME ──────────────────────────────────────── */
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 8px #1a1a1a, 0 0 0 10px #333;
    flex-shrink: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .phone-frame::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 150px; height: 28px;
    background: #1a1a1a;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }
  .phone-content {
    padding-top: 28px;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .phone-content::-webkit-scrollbar { display: none; }

  /* ─── INSTAGRAM HEADER ─────────────────────────────────── */
  .insta-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #222;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .insta-header .back-arrow { font-size: 20px; color: var(--cream); }
  .insta-header .username   { font-weight: 700; font-size: 16px; color: var(--cream); }
  .insta-header .dots       { font-size: 20px; color: var(--cream); letter-spacing: 2px; }

  /* ─── PROFILE ──────────────────────────────────────────── */
  .profile-section { padding: 16px; background: var(--bg); }
  .profile-top { display: flex; align-items: center; gap: 24px; margin-bottom: 14px; }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid var(--red); padding: 2px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .stats { display: flex; gap: 20px; flex: 1; justify-content: center; }
  .stat { text-align: center; }
  .stat-num   { font-weight: 700; font-size: 16px; color: var(--cream); }
  .stat-label { font-size: 12px; color: #888; }
  .bio-name { font-weight: 700; font-size: 14px; color: var(--cream); margin-bottom: 2px; }
  .bio-text { font-size: 13px; color: #ccc; line-height: 1.4; margin-bottom: 4px; }
  .bio-link { font-size: 13px; color: #7ab3e0; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .bio-link::before { content: '🔗'; font-size: 11px; }

  /* ─── BUTTONS ──────────────────────────────────────────── */
  .action-buttons { display: flex; gap: 6px; padding: 0 16px 12px; }
  .btn {
    flex: 1; padding: 7px; border: 1px solid #333; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-align: center; color: var(--cream);
    background: #1a1a1a; font-family: inherit; cursor: default;
  }
  .btn-primary { background: var(--red); color: white; border-color: var(--red); }

  /* ─── HIGHLIGHTS ───────────────────────────────────────── */
  .highlights {
    display: flex; gap: 16px;
    padding: 10px 16px 14px;
    overflow-x: auto;
    background: var(--bg);
  }
  .highlight { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; }
  .highlight-circle {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid #333;
    display: flex; justify-content: center; align-items: center;
    background: #1a1a1a;
  }
  .highlight-circle svg {
    width: 28px; height: 28px; fill: none;
    stroke: var(--cream); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .highlight-label { font-size: 10px; color: #aaa; font-weight: 500; text-align: center; }

  /* ─── TABS ─────────────────────────────────────────────── */
  .tabs { display: flex; border-bottom: 1px solid #222; background: var(--bg); }
  .tab {
    flex: 1; text-align: center; padding: 10px; font-size: 18px;
    color: #555; border-bottom: 2px solid transparent; cursor: default;
  }
  .tab.active { color: var(--cream); border-bottom-color: var(--cream); }

  /* ─── GRID ─────────────────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .grid-item { aspect-ratio: 1; overflow: hidden; cursor: pointer; position: relative; transition: opacity 0.2s; }
  .grid-item:hover { opacity: 0.85; }
  .grid-item .post-thumb {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 10px; text-align: center;
  }
  .thumb-photo .overlay-text {
    position: absolute; bottom: 4px; left: 4px; right: 4px;
    font-size: 5.5px; font-weight: 700; color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7); text-align: left;
  }
  .t-logo { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; margin-bottom: 6px; }
  .t-logo img { width: 100%; height: 100%; object-fit: cover; }
  .t-text-sm { font-size: 7px; font-weight: 700; }
  .t-dot { width: 4px; height: 4px; background: var(--red); border-radius: 50%; margin: 3px auto; }
  .t-quote { font-size: 20px; color: rgba(255,255,255,0.4); font-family: Georgia; }

  /* ─── BOTTOM NAV ───────────────────────────────────────── */
  .insta-bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 0 14px;
    background: var(--bg);
    border-top: 1px solid #222;
  }
  .insta-bottom-nav span { font-size: 20px; cursor: default; }
  .nav-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--red); display: inline-block;
    border: 2px solid #555; vertical-align: middle;
  }

  /* ─── POST CARDS (right column) ────────────────────────── */
  .posts-section { flex: 1; min-width: 320px; max-width: 520px; }
  .posts-title    { font-size: 24px; font-weight: 800; color: var(--cream); margin-bottom: 8px; }
  .posts-subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }

  .post-card {
    background: var(--bg-card); border-radius: 16px; overflow: hidden;
    margin-bottom: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .post-card-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .post-card-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--red); }
  .post-card-user     { font-weight: 700; font-size: 14px; color: var(--cream); }
  .post-card-location { font-size: 12px; color: #777; }
  .post-card-image    { width: 100%; aspect-ratio: 1; }
  .post-card-caption  { padding: 14px 16px; }
  .caption-user { font-weight: 700; font-size: 13px; color: var(--cream); }
  .caption-text { font-size: 13px; color: #ccc; line-height: 1.5; }
  .caption-tags { font-size: 12px; color: #7ab3e0; margin-top: 6px; }
  .post-card-label {
    background: var(--red); color: white; font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px; display: inline-block;
    margin: 0 16px 14px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .post-actions { display: flex; gap: 16px; padding: 8px 16px; font-size: 22px; color: var(--cream); }

  /* ─── POST DESIGNS ─────────────────────────────────────── */
  .post-design {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; position: relative; overflow: hidden;
  }
  /* Brand post */
  .post-brand { background: var(--bg-post1); padding: 40px; text-align: center; }
  .post-brand .logo-img {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    margin: 0 auto 24px; display: block; border: 3px solid var(--red);
  }
  .post-brand h2  { font-size: 22px; font-weight: 800; color: var(--cream); margin-bottom: 8px; line-height: 1.2; }
  .post-brand .divider { width: 40px; height: 3px; background: var(--red); margin: 12px auto; }
  .post-brand p   { font-size: 13px; color: #999; line-height: 1.5; }
  .post-brand .tagline { margin-top: 20px; font-size: 11px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 2px; }
  /* Services post */
  .post-services { background: #111; padding: 40px; text-align: left; }
  .post-services .label { font-size: 10px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
  .post-services h2 { font-size: 24px; font-weight: 800; color: white; line-height: 1.2; margin-bottom: 20px; }
  .services-list { list-style: none; }
  .services-list li { color: rgba(255,255,255,0.75); font-size: 14px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
  .services-list li .dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; flex-shrink: 0; }
  .cta-bottom { margin-top: 24px; background: var(--red); color: white; font-size: 12px; font-weight: 700; padding: 10px 20px; border-radius: 6px; display: inline-block; }
  /* Quote post */
  .post-quote { background: var(--red); padding: 40px; text-align: center; }
  .post-quote .quote-mark { font-size: 60px; color: rgba(255,255,255,0.3); font-family: Georgia; line-height: 1; margin-bottom: 8px; }
  .post-quote blockquote { font-size: 16px; color: white; font-weight: 500; line-height: 1.5; font-style: italic; margin-bottom: 16px; }
  .post-quote .quote-author { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 600; }
  .post-quote .quote-role   { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .post-quote .divider-white { width: 40px; height: 2px; background: rgba(255,255,255,0.3); margin: 16px auto; }
  .post-quote .cta-text { font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 600; margin-top: 16px; }

  /* ─── RESPONSIVE ───────────────────────────────────────── */
  @media (max-width: 900px) {
    .page-wrapper { flex-direction: column; align-items: center; }
    .posts-section { max-width: 375px; }
  }
</style>
</head>
<body>

<div class="page-wrapper" id="app">
  <!-- Phone and post cards are injected by JS -->
</div>

<script>
// ─── ICON SVGs ────────────────────────────────────────────────
const ICONS = {
  team:  `<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
  check: `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`,
  image: `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>`,
  tool:  `<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>`,
};

// ─── APPLY COLORS FROM CONFIG ────────────────────────────────
function applyColors() {
  const r = document.documentElement.style;
  r.setProperty('--red',      CLIENT.colors.primary);
  r.setProperty('--cream',    CLIENT.colors.cream);
  r.setProperty('--bg',       CLIENT.colors.bg);
  r.setProperty('--bg-card',  CLIENT.colors.bg_card);
  r.setProperty('--bg-post1', CLIENT.colors.bg_post1);
  document.title = CLIENT.name + ' — Instagram Mockup';
}

// ─── BUILD PHONE ─────────────────────────────────────────────
function buildPhone() {
  // Grid thumbnails
  const gridHTML = CLIENT.grid.map(item => {
    if (item.type === 'brand') return `
      <div class="grid-item">
        <div class="post-thumb" style="background:var(--bg-post1)">
          <div class="t-logo"><img src="${CLIENT.logo}" alt="Logo" onerror="this.style.display='none'"></div>
          <div class="t-text-sm" style="color:var(--cream)">${item.label}</div>
        </div>
      </div>`;
    if (item.type === 'dark') return `
      <div class="grid-item">
        <div class="post-thumb" style="background:#111">
          <div class="t-dot"></div>
          <div class="t-text-sm" style="color:white;text-align:center">${item.label}</div>
          <div class="t-dot"></div>
        </div>
      </div>`;
    if (item.type === 'red') return `
      <div class="grid-item">
        <div class="post-thumb" style="background:var(--red)">
          <div class="t-quote">"</div>
          <div class="t-text-sm" style="color:white;text-align:center">${item.label}</div>
        </div>
      </div>`;
    // photo
    return `
      <div class="grid-item thumb-photo" style="background:${item.gradient}">
        <div class="overlay-text">${item.label}</div>
      </div>`;
  }).join('');

  // Highlights
  const hlHTML = CLIENT.highlights.map(h => `
    <div class="highlight">
      <div class="highlight-circle">
        <svg viewBox="0 0 24 24">${ICONS[h.icon] || ICONS.tool}</svg>
      </div>
      <div class="highlight-label">${h.label}</div>
    </div>`).join('');

  return `
  <div class="phone-frame">
    <div class="phone-content">
      <div class="insta-header">
        <span class="back-arrow">‹</span>
        <span class="username">${CLIENT.handle}</span>
        <span class="dots">•••</span>
      </div>
      <div class="profile-section">
        <div class="profile-top">
          <div class="avatar">
            <img src="${CLIENT.logo}" alt="Logo" onerror="this.style.background='var(--red)'">
          </div>
          <div class="stats">
            <div class="stat"><div class="stat-num">${CLIENT.stats.posts}</div><div class="stat-label">Posts</div></div>
            <div class="stat"><div class="stat-num">${CLIENT.stats.followers}</div><div class="stat-label">Followers</div></div>
            <div class="stat"><div class="stat-num">${CLIENT.stats.following}</div><div class="stat-label">Following</div></div>
          </div>
        </div>
        <div class="bio-name">${CLIENT.name}</div>
        <div class="bio-text">${CLIENT.bio_line1}<br>${CLIENT.bio_line2}<br>${CLIENT.bio_line3}</div>
        <div class="bio-link">${CLIENT.website}</div>
      </div>
      <div class="action-buttons">
        <div class="btn btn-primary">Folgen</div>
        <div class="btn">Nachricht</div>
        <div class="btn">E-Mail</div>
      </div>
      <div class="highlights">${hlHTML}</div>
      <div class="tabs">
        <div class="tab active">▦</div>
        <div class="tab">▷</div>
        <div class="tab">☻</div>
      </div>
      <div class="grid">${gridHTML}</div>
    </div>
    <div class="insta-bottom-nav">
      <span>🏠</span><span>🔍</span><span>➕</span><span>🎬</span>
      <span class="nav-avatar"></span>
    </div>
  </div>`;
}

// ─── BUILD POST CARDS ─────────────────────────────────────────
function buildPostCard(card) {
  let imageHTML = '';

  if (card.type === 'brand') {
    imageHTML = `
      <div class="post-card-image post-design post-brand">
        <img class="logo-img" src="${CLIENT.logo}" alt="Logo" onerror="this.style.display='none'">
        <h2>${card.heading}</h2>
        <div class="divider"></div>
        <p>${card.subtext}</p>
        <div class="tagline">${card.tagline}</div>
      </div>`;
  } else if (card.type === 'services') {
    const svcsHTML = card.services.map(s => `<li><span class="dot"></span>${s}</li>`).join('');
    imageHTML = `
      <div class="post-card-image post-design post-services">
        <div class="label">Unsere Leistungen</div>
        <h2>${card.heading}</h2>
        <ul class="services-list">${svcsHTML}</ul>
        <div class="cta-bottom">${card.cta}</div>
      </div>`;
  } else if (card.type === 'quote') {
    imageHTML = `
      <div class="post-card-image post-design post-quote">
        <div class="quote-mark">"</div>
        <blockquote>${card.quote}</blockquote>
        <div class="divider-white"></div>
        <div class="quote-author">${card.author}</div>
        <div class="quote-role">${card.role}</div>
        <div class="cta-text">${card.cta}</div>
      </div>`;
  }

  return `
  <div class="post-card">
    <div class="post-card-label">${card.label}</div>
    <div class="post-card-header">
      <img class="post-card-avatar" src="${CLIENT.logo}" alt="Logo" onerror="this.style.background='var(--red)'">
      <div>
        <div class="post-card-user">${CLIENT.handle}</div>
        <div class="post-card-location">${card.location}</div>
      </div>
    </div>
    ${imageHTML}
    <div class="post-actions"><span>♡</span> <span>💬</span> <span>➤</span></div>
    <div class="post-card-caption">
      <span class="caption-user">${CLIENT.handle} </span>
      <span class="caption-text">${card.caption}</span>
      <div class="caption-tags">${card.tags}</div>
    </div>
  </div>`;
}

// ─── INIT ─────────────────────────────────────────────────────
function init() {
  applyColors();

  const cardsHTML = CLIENT.post_cards.map(buildPostCard).join('');

  document.getElementById('app').innerHTML = `
    ${buildPhone()}
    <div class="posts-section">
      <div class="posts-title">Instagram Post-Designs</div>
      <div class="posts-subtitle">3 Mockups für ${CLIENT.name}</div>
      ${cardsHTML}
    </div>`;
}

init();
</script>
</body>
</html>
